    {{- $desc := or .Description .Summary .Site.Params.description -}}
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
    <meta property="og:title" content="{{ .Site.Title }}{{ with .Title }} - {{ . }}{{ end }}">
    <meta property="og:description" content="{{ $desc }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ .Site.Params.portrait }}">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="{{ .Permalink }}">
    <style>
      .about_right h2 p { margin: 0 0 1em 0; }
      .about_right h2 p:last-child { margin-bottom: 0; }
      .list-show-title { text-align: center; padding: 20px 0; }
    </style>
